name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - v8
      - v9

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_lint:
    name: Python undefined names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check Python for undefined and redefined names
        run: |
          python -m pip install ruff==0.11.13
          ruff check --target-version py312 --select F821 src tests .github/ci
          ruff check --target-version py312 --select F811 src

  python312_shards:
    name: Python 3.12 shards
    uses: ./.github/workflows/python-tests.yml
    with:
      python-version: "3.12"

  python314_shards:
    name: Python 3.14 shards
    uses: ./.github/workflows/python-tests.yml
    with:
      python-version: "3.14"

  python312:
    name: Python 3.12
    if: ${{ always() }}
    needs: python312_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this version's shards
        env:
          RESULT: ${{ needs.python312_shards.result }}
        run: test "$RESULT" = success

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify complete Python coverage
        uses: ./.github/actions/verify-python-coverage
        with:
          python-version: "3.12"

  python314:
    name: Python 3.14
    if: ${{ always() }}
    needs: python314_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this version's shards
        env:
          RESULT: ${{ needs.python314_shards.result }}
        run: test "$RESULT" = success

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify complete Python coverage
        uses: ./.github/actions/verify-python-coverage
        with:
          python-version: "3.14"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python for PyO3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - name: Run Rust tests
        working-directory: passivbot-rust
        run: cargo test --locked --no-default-features

      - name: Check Rust test targets with default features
        working-directory: passivbot-rust
        run: cargo check --locked --tests

      - name: Report Rust formatting drift
        continue-on-error: true
        working-directory: passivbot-rust
        run: cargo fmt --all -- --check

      - name: Report Clippy findings
        continue-on-error: true
        working-directory: passivbot-rust
        run: cargo clippy --locked --all-targets
