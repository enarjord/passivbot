name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - v8

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python312_shards:
    name: Python 3.12 shards
    uses: ./.github/workflows/python-tests.yml
    with:
      python-version: "3.12"

  python314_shards:
    name: Python 3.14 shards
    uses: ./.github/workflows/python-tests.yml
    with:
      python-version: "3.14"

  python312:
    name: Python 3.12
    if: ${{ always() }}
    needs: python312_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this version's complete test gate
        env:
          RESULT: ${{ needs.python312_shards.result }}
        run: test "$RESULT" = success

  python314:
    name: Python 3.14
    if: ${{ always() }}
    needs: python314_shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this version's complete test gate
        env:
          RESULT: ${{ needs.python314_shards.result }}
        run: test "$RESULT" = success

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python for PyO3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - name: Run Rust tests
        working-directory: passivbot-rust
        run: cargo test --no-default-features

      - name: Check Rust test targets with default features
        working-directory: passivbot-rust
        run: cargo check --tests
